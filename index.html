<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Press Express Assam — অসমৰ শেহতীয়া খবৰ</title>

<meta name="description"
content="Press Express Assam — অসমৰ স্থানীয়, ৰাজ্যিক, ৰাষ্ট্ৰীয় আৰু আন্তঃৰাষ্ট্ৰীয় শেহতীয়া খবৰ। সত্য, নিৰপেক্ষ আৰু দায়িত্বশীল সংবাদ।">

<meta name="robots" content="index,follow">

<meta name="theme-color" content="#c8102e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Assamese:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* =========================================================
   PRESS EXPRESS ASSAM
   COMPLETE PROFESSIONAL NEWS PORTAL
   SINGLE FILE DESIGN
========================================================= */

:root{
  --red:#c8102e;
  --red-dark:#a70d26;
  --navy:#111827;
  --navy-2:#1f2937;
  --text:#171717;
  --muted:#737373;
  --bg:#f4f6f8;
  --white:#ffffff;
  --line:#e5e7eb;
  --soft:#f8fafc;
  --shadow:0 8px 28px rgba(15,23,42,.08);
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Noto Sans Assamese","Nirmala UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.55;
}

img{
  display:block;
  max-width:100%;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font-family:inherit;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  background:var(--navy);
  color:#fff;
  height:36px;
  font-size:12px;
}

.topbar-inner{
  width:min(1400px,94%);
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.topbar-right{
  opacity:.9;
}

/* =========================
   HEADER
========================= */

.header{
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  width:min(1400px,94%);
  margin:auto;
  min-height:90px;
  display:flex;
  align-items:center;
  gap:20px;
}

/* LOGO */

.logo-box{
  width:78px;
  height:78px;
  flex:0 0 78px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  width:76px;
  height:76px;
  object-fit:contain;
}

/* BRAND */

.brand{
  min-width:190px;
}

.brand-name{
  font-family:Arial,sans-serif;
  font-size:25px;
  line-height:1.05;
  font-weight:800;
  letter-spacing:-.5px;
}

.brand-name span{
  color:var(--red);
}

.brand-tagline{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

/* SOCIAL */

.social{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:4px;
}

.social a{
  width:36px;
  height:36px;
  border-radius:50%;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  font-weight:800;
  font-size:15px;
  transition:.2s;
}

.social a:hover{
  transform:translateY(-2px);
}

.fb{background:#1877f2}
.wa{background:#20c777}
.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
.yt{background:#d90018}

/* NAV */

.nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
}

.nav a{
  padding:10px 11px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}

.nav a:hover,
.nav a.active{
  color:var(--red);
  background:#fff1f3;
}

/* LIVE */

.live-btn{
  margin-left:10px;
  background:var(--red);
  color:#fff;
  border:0;
  border-radius:10px;
  padding:12px 17px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 6px 16px rgba(200,16,46,.22);
}

.live-btn:hover{
  background:var(--red-dark);
}

/* =========================
   BREAKING TICKER
========================= */

.ticker{
  height:46px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  overflow:hidden;
}

.breaking-label{
  height:100%;
  min-width:150px;
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:14px;
  position:relative;
  z-index:2;
}

.ticker-window{
  overflow:hidden;
  flex:1;
}

.ticker-track{
  display:inline-flex;
  gap:45px;
  white-space:nowrap;
  animation:ticker 25s linear infinite;
  padding-left:25px;
  font-size:14px;
  font-weight:600;
}

.ticker-item::before{
  content:"•";
  color:var(--red);
  margin-right:10px;
}

@keyframes ticker{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* =========================
   PAGE
========================= */

.container{
  width:min(1400px,94%);
  margin:0 auto;
}

/* =========================
   SEARCH
========================= */

.search-panel{
  background:#fff;
  margin-top:24px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 4px 18px rgba(15,23,42,.04);
}

.search-box{
  height:52px;
  border:1px solid #ddd;
  border-radius:13px;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:10px;
  background:#fff;
}

.search-icon{
  font-size:20px;
  color:#777;
}

.search-box input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  font-size:15px;
  color:var(--text);
}

.categories{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.category{
  border:1px solid #ddd;
  background:#fff;
  padding:8px 18px;
  border-radius:22px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:.2s;
}

.category:hover,
.category.active{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

/* =========================
   SECTION TITLE
========================= */

.section-head{
  margin-top:34px;
  margin-bottom:18px;
  display:flex;
  align-items:end;
  justify-content:space-between;
}

.section-title{
  font-size:25px;
  line-height:1.2;
  font-weight:800;
  border-left:5px solid var(--red);
  padding-left:13px;
}

.section-brand{
  color:var(--red);
  font-size:13px;
  font-weight:700;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;
  min-height:470px;
  border-radius:20px;
  background:linear-gradient(135deg,#172033,#080b11);
  box-shadow:var(--shadow);
}

.hero-img{
  width:100%;
  height:470px;
  object-fit:cover;
  opacity:.88;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.92) 0%,
      rgba(0,0,0,.58) 38%,
      rgba(0,0,0,.04) 78%
    );
}

.hero-content{
  position:absolute;
  left:32px;
  right:32px;
  bottom:28px;
  color:#fff;
  max-width:900px;
}

.badge{
  display:inline-block;
  background:var(--red);
  color:#fff;
  padding:5px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:800;
  margin-bottom:10px;
}

.hero-title{
  font-size:31px;
  line-height:1.22;
  font-weight:800;
  margin-bottom:8px;
}

.hero-description{
  font-size:14px;
  color:#e5e7eb;
  max-width:720px;
}

/* =========================
   NEWS GRID
========================= */

.news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-top:24px;
}

.news-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(15,23,42,.05);
  transition:.25s;
}

.news-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(15,23,42,.11);
}

.news-image-wrap{
  height:220px;
  background:#e9edf2;
  overflow:hidden;
}

.news-image{
  width:100%;
  height:100%;
  object-fit:cover;
}

.news-content{
  padding:16px;
}

.news-meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
  font-size:11px;
  color:#777;
}

.news-category{
  background:#fff0f2;
  color:var(--red);
  border-radius:5px;
  padding:4px 8px;
  font-weight:800;
}

.news-title{
  font-size:19px;
  line-height:1.35;
  font-weight:800;
  margin-bottom:7px;
}

.news-description{
  font-size:13px;
  color:#707070;
  line-height:1.6;
}

.read-more{
  display:inline-block;
  color:var(--red);
  font-size:13px;
  font-weight:800;
  margin-top:12px;
}

/* =========================
   EMPTY / LOADING
========================= */

.loading{
  grid-column:1/-1;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:35px;
  text-align:center;
  color:#777;
}

.no-results{
  display:none;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:35px;
  text-align:center;
  color:#777;
}

/* =========================
   FOOTER
========================= */

.footer{
  margin-top:60px;
  background:#101820;
  color:#fff;
}

.footer-inner{
  width:min(1400px,94%);
  margin:auto;
  padding:42px 0 25px;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:40px;
}

.footer-logo{
  width:70px;
  height:70px;
  object-fit:contain;
  margin-bottom:12px;
  background:#fff;
