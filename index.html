<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    "Noto Sans Assamese",
    Arial,
    sans-serif;

  background:#f3f5f7;
  color:#15171a;
  line-height:1.5;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

a{
  color:inherit;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{
  --red:#c8102e;
  --dark:#111820;
  --dark2:#18212a;
  --text:#16191d;
  --muted:#747b83;
  --border:#e2e5e8;
  --white:#fff;
  --shadow:
    0 5px 22px rgba(16,24,40,.07);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  background:#101820;
  color:#fff;
  min-height:34px;
}

.topbar-inner{
  width:94%;
  max-width:1450px;
  margin:auto;

  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  font-size:13px;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.topbar-right{
  color:#d9dde1;
}


/* =========================================================
   MAIN HEADER
========================================================= */

.site-header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:9999;
}

.header-inner{
  width:94%;
  max-width:1450px;
  margin:auto;

  min-height:86px;

  display:flex;
  align-items:center;

  gap:20px;
}


/* =========================================================
   LOGO
========================================================= */

.brand{
  width:125px;
  height:76px;

  flex:0 0 125px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.brand img{
  width:110px;
  height:70px;

  object-fit:contain;

  display:block;
}


/* =========================================================
   SOCIAL
========================================================= */

.social{
  display:flex;
  align-items:center;
  gap:7px;

  flex:0 0 auto;
}

.social a{
  width:35px;
  height:35px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  text-decoration:none;

  font-size:16px;

  transition:.2s;
}

.social a:hover{
  transform:translateY(-2px);
}

.fb{
  background:#1877f2;
}

.wa{
  background:#25d366;
}

.ig{
  background:
    linear-gradient(
      135deg,
      #feda75,
      #fa7e1e,
      #d62976,
      #962fbf,
      #4f5bd5
    );
}

.yt{
  background:#ff0000;
}


/* =========================================================
   NAVIGATION
========================================================= */

.main-nav{
  margin-left:auto;

  display:flex;
  align-items:center;

  gap:23px;

  overflow-x:auto;

  scrollbar-width:none;

  white-space:nowrap;
}

.main-nav::-webkit-scrollbar{
  display:none;
}

.main-nav a{
  text-decoration:none;

  font-size:16px;
  font-weight:700;

  color:#25282c;

  padding:8px 0;

  position:relative;
}

.main-nav a:hover,
.main-nav a.active{
  color:var(--red);
}

.main-nav a.active::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:3px;

  background:var(--red);

  border-radius:5px;
}


/* =========================================================
   LIVE
========================================================= */

.live-btn{
  flex:0 0 auto;

  text-decoration:none;

  background:var(--red);
  color:#fff;

  padding:10px 17px;

  border-radius:9px;

  font-weight:800;

  box-shadow:
    0 5px 14px rgba(200,16,46,.22);

  transition:.2s;
}

.live-btn:hover{
  background:#a90d26;
  transform:translateY(-1px);
}


/* =========================================================
   BREAKING BAR
========================================================= */

.breaking{
  background:#fff;

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;

  overflow:hidden;

  min-height:46px;
}

.breaking-label{
  flex:0 0 auto;

  background:var(--red);

  color:#fff;

  padding:12px 22px;

  font-size:14px;
  font-weight:800;

  text-transform:uppercase;
}

.breaking-track{
  overflow:hidden;
  white-space:nowrap;

  flex:1;

  position:relative;
}

.breaking-track-inner{
  display:inline-flex;
  gap:70px;

  padding-left:25px;

  animation:ticker 32s linear infinite;
}

.breaking-track span{
  font-size:14px;
  color:#34383d;
}

@keyframes ticker{
  from{
    transform:translateX(0);
  }
  to{
    transform:translateX(-50%);
  }
}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
  width:94%;
  max-width:1450px;

  margin:0 auto;
}


/* =========================================================
   SEARCH + CATEGORIES
========================================================= */

.tools-panel{
  margin-top:22px;

  background:#fff;

  border:1px solid var(--border);

  border-radius:16px;

  padding:15px;

  box-shadow:var(--shadow);
}

.tools-row{
  display:flex;
  align-items:center;
  gap:14px;
}

.search-wrap{
  position:relative;
  flex:1;
}

.search-icon{
  position:absolute;

  left:16px;
  top:50%;

  transform:translateY(-50%);

  color:#858b91;
}

.search-box{
  width:100%;

  height:48px;

  border:1px solid #dfe3e6;

  border-radius:11px;

  padding:0 16px 0 45px;

  outline:none;

  font-size:15px;

  background:#fafbfc;
}

.search-box:focus{
  border-color:var(--red);

  box-shadow:
    0 0 0 3px rgba(200,16,46,.08);
}

.categories{
  display:flex;
  align-items:center;

  gap:8px;

  overflow-x:auto;

  scrollbar-width:none;

  margin-top:13px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;

  border:1px solid #dfe2e5;

  background:#fff;

  color:#34373b;

  padding:8px 17px;

  border-radius:25px;

  font-weight:700;

  font-size:14px;

  transition:.2s;
}

.category:hover,
.category.active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}


/* =========================================================
   HOME GRID
========================================================= */

.home-grid{
  display:grid;

  grid-template-columns:
    minmax(0,2fr)
    minmax(280px,.72fr);

  gap:22px;

  margin-top:22px;

  align-items:start;
}


/* =========================================================
   HERO
========================================================= */

.hero-card{
  position:relative;

  background:#111;

  border-radius:18px;

  overflow:hidden;

  min-height:465px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.12);
}

.hero-image{
  width:100%;
  height:465px;

  object-fit:cover;

  display:block;

  opacity:.94;
}

.hero-overlay{
  position:absolute;

  inset:0;

  display:flex;
  align-items:flex-end;

  padding:34px;

  background:
    linear-gradient(
      to bottom,
      transparent 28%,
      rgba(0,0,0,.88) 100%
    );
}

.hero-content{
  color:#fff;
  max-width:900px;
}

.hero-kicker{
  display:inline-flex;

  align-items:center;

  gap:6px;

  background:var(--red);

  padding:6px 11px;

  border-radius:6px;

  font-size:12px;

  font-weight:800;

  margin-bottom:11px;
}

.hero-title{
  font-size:36px;

  line-height:1.25;

  font-weight:800;

  margin-bottom:10px;
}

.hero-desc{
  font-size:16px;

  color:#e8e8e8;

  max-width:780px;
}

.hero-meta{
  margin-top:12px;

  display:flex;
  align-items:center;

  gap:16px;

  font-size:13px;

  color:#ddd;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  display:flex;
  flex-direction:column;
  gap:16px;
}


/* =========================================================
   SIDEBAR CARD
========================================================= */

.side-panel{
  background:#fff;

  border:1px solid var(--border);

  border-radius:16px;

  padding:17px;

  box-shadow:var(--shadow);
}

.panel-title{
  display:flex;

  align-items:center;

  gap:9px;

  font-size:20px;

  font-weight:800;

  padding-bottom:11px;

  border-bottom:2px solid #222;

  margin-bottom:13px;
}

.panel-title::before{
  content:"";

  width:5px;
  height:24px;

  background:var(--red);

  border-radius:5px;
}


/* =========================================================
   LATEST SIDEBAR ITEM
   IMPORTANT: FIXED IMAGE SIZE
========================================================= */

.latest-item{
  display:grid;

  grid-template-columns:92px minmax(0,1fr);

  gap:11px;

  padding:10px 0;

  border-bottom:1px solid #eceef0;

  cursor:pointer;
}

.latest-item:last-child{
  border-bottom:0;
}

.latest-thumb{
  width:92px;
  height:72px;

  border-radius:9px;

  overflow:hidden;

  background:#eee;

  display:flex;
  align-items:center;
  justify-content:center;
}

.latest-thumb img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.latest-info{
  min-width:0;
}

.latest-cat{
  color:var(--red);

  font-size:11px;

  font-weight:800;

  text-transform:uppercase;

  margin-bottom:2px;
}

.latest-title{
  font-size:14px;

  line-height:1.35;

  font-weight:700;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.latest-date{
  color:#8a8f94;

  font-size:10px;

  margin-top:4px;
}


/* =========================================================
   ABOUT SIDE
========================================================= */

.about-panel{
  background:#fff;

  border:1px solid var(--border);

  border-radius:16px;

  padding:18px;

  box-shadow:var(--shadow);
}

.about-logo{
  width:100%;
  height:105px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:10px;

  overflow:hidden;
}

.about-logo img{
  width:140px;
  height:100px;

  object-fit:contain;
}

.about-panel h3{
  font-size:19px;

  margin-bottom:8px;
}

.about-panel p{
  color:#747a80;

  font-size:13px;

  line-height:1.8;
}


/* =========================================================
   NEWS SECTION
========================================================= */

.news-section{
  margin-top:30px;
}

.section-heading{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  margin-bottom:17px;
}

.section-heading h2{
  font-size:26px;

  line-height:1.3;

  position:relative;

  padding-left:13px;
}

.section-heading h2::before{
  content:"";

  position:absolute;

  left:0;
  top:3px;
  bottom:3px;

  width:5px;

  background:var(--red);

  border-radius:5px;
}

.section-count{
  color:#777;

  font-size:13px;
}


/* =========================================================
   NEWS GRID
========================================================= */

.news-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:20px;
}


/* =========================================================
   NEWS CARD
========================================================= */

.news-card{
  background:#fff;

  border:1px solid var(--border);

  border-radius:15px;

  overflow:hidden;

  box-shadow:
    0 4px 18px rgba(20,25,30,.055);

  transition:
    transform .2s,
    box-shadow .2s;
}

.news-card:hover{
  transform:translateY(-4px);

  box-shadow:
    0 12px 30px rgba(20,25,30,.11);
}

.news-image-wrap{
  width:100%;
  height:220px;

  overflow:hidden;

  background:#eee;

  position:relative;
}

.news-image{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  transition:.35s;
}

.news-card:hover .news-image{
  transform:scale(1.04);
}

.news-category{
  position:absolute;

  left:12px;
  top:12px;

  background:var(--red);

  color:#fff;

  padding:5px 9px;

  border-radius:5px;

  font-size:11px;

  font-weight:800;
}

.news-body{
  padding:16px;
}

.news-date{
  color:#8b9095;

  font-size:11px;

  margin-bottom:6px;
}

.news-title{
  font-size:19px;

  line-height:1.4;

  font-weight:800;

  margin-bottom:8px;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.news-excerpt{
  color:#6d7379;

  font-size:13px;

  line-height:1.7;

  display:-webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.news-bottom{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-top:13px;

  padding-top:12px;

  border-top:1px solid #eee;
}

.read-more{
  color:var(--red);

  font-size:13px;

  font-weight:800;

  border:0;

  background:transparent;

  padding:0;
}

.views{
  color:#888;

  font-size:11px;
}


/* =========================================================
   LOADING
========================================================= */

.loading-box{
  grid-column:1/-1;

  background:#fff;

  border:1px solid var(--border);

  border-radius:15px;

  min-height:240px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:12px;

  color:#888;
}

.spinner{
  width:32px;
  height:32px;

  border:3px solid #ddd;

  border-top-color:var(--red);

  border-radius:50%;

  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   ERROR / EMPTY
========================================================= */

.empty-box{
  grid-column:1/-1;

  background:#fff;

  border:1px solid var(--border);

  border-radius:15px;

  padding:40px 20px;

  text-align:center;

  color:#777;
}

.empty-box i{
  font-size:32px;

  color:#bbb;

  margin-bottom:10px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  background:#101820;

  color:#c6ccd1;

  margin-top:55px;

  padding:45px 0 25px;
}

.footer-grid{
  width:94%;
  max-width:1450px;

  margin:auto;

  display:grid;

  grid-template-columns:
    1.5fr 1fr 1fr;

  gap:50px;
}

.footer-brand{
  max-width:480px;
}

.footer-logo{
  width:150px;
  height:80px;

  background:#fff;

  border-radius:9px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:15px;

  overflow:hidden;
}

.footer-logo img{
  width:125px;
  height:70px;

  object-fit:contain;
}

.footer-brand p{
  font-size:13px;

  line-height:1.8;

  color:#aeb6bd;
}

.footer-column h3{
  color:#fff;

  font-size:17px;

  margin-bottom:13px;
}

.footer-column a{
  display:block;

  color:#aeb6bd;

  text-decoration:none;

  font-size:13px;

  margin:9px 0;
}

.footer-column a:hover{
  color:#fff;
}

.footer-bottom{
  width:94%;
  max-width:1450px;

  margin:30px auto 0;

  padding-top:18px;

  border-top:1px solid #2c353d;

  text-align:center;

  color:#8f989f;

  font-size:12px;
}


/* =========================================================
   ADMIN FLOAT BUTTON
========================================================= */

.admin-btn{
  position:fixed;

  right:20px;
  bottom:20px;

  z-index:10000;

  border:0;

  background:#111820;

  color:#fff;

  padding:12px 17px;

  border-radius:28px;

  font-size:13px;

  font-weight:800;

  box-shadow:
    0 7px 25px rgba(0,0,0,.25);

  transition:.2s;
}

.admin-btn:hover{
  background:var(--red);

  transform:translateY(-2px);
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.72);

  z-index:20000;

  padding:18px;

  overflow:auto;
}

.modal.show{
  display:block;
}

.modal-box{
  width:100%;
  max-width:760px;

  margin:25px auto;

  background:#fff;

  border-radius:18px;

  padding:24px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.3);

  position:relative;
}

.close-btn{
  position:absolute;

  right:16px;
  top:16px;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:#f0f1f2;

  font-size:23px;

  color:#444;
}

.close-btn:hover{
  background:#ddd;
}


/* =========================================================
   ADMIN
========================================================= */

.admin-title{
  font-size:24px;

  font-weight:800;

  margin-bottom:3px;
}

.admin-subtitle{
  color:#888;

  font-size:13px;

  margin-bottom:20px;
}

.form-label{
  display:block;

  font-size:14px;

  font-weight:800;

  margin:16px 0 7px;
}

.form-input,
.form-select,
.form-textarea{
  width:100%;

  border:1px solid #dfe2e5;

  border-radius:10px;

  background:#fafbfc;

  padding:12px 13px;

  font-size:14px;

  outline:none;
}

.form-textarea{
  min-height:180px;

  resize:vertical;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
  border-color:var(--red);

  box-shadow:
    0 0 0 3px rgba(200,16,46,.08);
}

.publish-btn{
  width:100%;

  border:0;

  border-radius:10px;

  background:var(--red);

  color:#fff;

  padding:13px;

  font-size:15px;

  font-weight:800;

  margin-top:18px;
}

.publish-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.logout-btn{
  border:0;

  background:#222;

  color:#fff;

  padding:8px 13px;

  border-radius:7px;

  font-size:12px;

  font-weight:700;

  margin-bottom:10px;
}


/* =========================================================
   ADMIN NEWS LIST
========================================================= */

.admin-list{
  margin-top:15px;
}

.admin-item{
  border:1px solid #e2e4e6;

  border-radius:10px;

  padding:12px;

  margin-top:9px;

  background:#fafafa;
}

.admin-item-title{
  font-weight:800;

  font-size:14px;

  line-height:1.4;
