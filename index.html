<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#151922;
  font-family:
    system-ui,
    "Noto Sans Assamese",
    "Noto Sans",
    sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
textarea,
select{
  font-family:inherit;
}


/* =========================
   TOP BAR
========================= */

.top{
  background:#10151d;
  color:#fff;
  padding:8px 4%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
}


/* =========================
   HEADER
========================= */

.header{
  background:#fff;
  padding:15px 4%;
  display:flex;
  align-items:center;
  gap:16px;
  border-bottom:1px solid #ddd;
}

.logo{
  width:72px;
  height:72px;
  object-fit:contain;
  border-radius:50%;
}

.brand h1{
  margin:0;
  font-size:28px;
  line-height:1.2;
}

.brand h1 span{
  color:#c8102e;
}

.brand p{
  margin:4px 0 0;
  color:#999;
  font-size:12px;
}


/* =========================
   SOCIAL
========================= */

.social{
  display:flex;
  gap:7px;
  margin-left:auto;
}

.social a{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#f0f1f3;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:800;
  transition:.2s;
}

.social a:hover{
  background:#c8102e;
  color:#fff;
}


/* =========================
   LIVE BUTTON
========================= */

.live{
  background:#c8102e;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-weight:800;
  box-shadow:0 7px 18px #c8102e44;
  cursor:pointer;
}


/* =========================
   NAVIGATION
========================= */

.nav{
  background:#fff;
  display:flex;
  justify-content:center;
  overflow:auto;
  border-bottom:1px solid #ddd;
}

.nav a{
  padding:15px 20px;
  font-weight:700;
  white-space:nowrap;
  border-bottom:3px solid transparent;
}

.nav a:hover,
.nav a.active{
  color:#c8102e;
  border-bottom-color:#c8102e;
}


/* =========================
   BREAKING
========================= */

.breaking{
  display:flex;
  background:#fff;
  height:52px;
  overflow:hidden;
}

.break-title{
  background:#c8102e;
  color:#fff;
  padding:15px 28px;
  font-weight:800;
  white-space:nowrap;
}

.ticker{
  padding:15px 20px;
  color:#666;
  white-space:nowrap;
  overflow:hidden;
}

   CONTAINER
========================= */
