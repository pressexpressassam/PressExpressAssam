<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Press Express Assam — অসমৰ শেহতীয়া খবৰ</title>

<meta name="description" content="Press Express Assam — অসমৰ শেহতীয়া খবৰ, স্থানীয় সংবাদ, গুৱাহাটী, ভাৰত, বিশ্ব, ব্যৱসায়, খেল আৰু বিনোদনৰ গুৰুত্বপূৰ্ণ সংবাদ।">

<meta name="robots" content="index, follow">
<meta name="theme-color" content="#c8102e">

<style>
/* =========================================================
   PRESS EXPRESS ASSAM
   FINAL PROFESSIONAL NEWS PORTAL
   SINGLE FILE VERSION
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Assamese:wght@400;500;600;700;800&display=swap');

:root{
  --red:#c8102e;
  --red-dark:#a80d27;
  --black:#11151c;
  --dark:#1b2028;
  --text:#171b22;
  --muted:#707780;
  --light:#f5f6f8;
  --white:#ffffff;
  --border:#e4e7eb;
  --shadow:0 8px 28px rgba(17,21,28,.08);
  --shadow-hover:0 14px 38px rgba(17,21,28,.14);
  --radius:18px;
  --max:1240px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Noto Sans Assamese","Noto Sans",Arial,sans-serif;
  background:var(--light);
  color:var(--text);
  line-height:1.6;
}

button,
input{
  font-family:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= TOP BAR ================= */

.topbar{
  background:var(--black);
  color:#fff;
  font-size:13px;
}

.topbar-inner{
  max-width:var(--max);
  margin:auto;
  min-height:36px;
  padding:0 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top-right{
  opacity:.9;
}

/* ================= HEADER ================= */

.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:var(--max);
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:20px;
}

/* LOGO */

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:250px;
}

.logo{
  width:58px;
  height:58px;
  border:3px solid var(--red);
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:0 3px 12px rgba(200,16,46,.12);
  flex-shrink:0;
}

.logo:after{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid #ddd;
  border-radius:50%;
}

.logo-main{
  font-family:Arial,sans-serif;
  font-size:27px;
  font-weight:900;
  color:var(--red);
  line-height:1;
  position:relative;
  z-index:2;
}

.logo-small{
  position:absolute;
  bottom:8px;
  font-size:6px;
  font-weight:800;
  letter-spacing:1px;
  color:#222;
  z-index:3;
}

.brand-title{
  font-family:Arial,sans-serif;
  font-size:24px;
  font-weight:800;
  line-height:1.05;
}

.brand-title span{
  color:var(--red);
}

.brand-sub{
  margin-top:3px;
  color:#858b92;
  font-size:12px;
}

/* NAV */

.nav{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:3px;
}

.nav a{
  padding:9px 11px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  transition:.2s;
}

.nav a:hover,
.nav a.active{
  color:var(--red);
  background:#fff1f3;
}

/* LIVE */

.live-btn{
  background:var(--red);
  color:#fff;
  border:0;
  border-radius:11px;
  padding:12px 17px;
  font-size:14px;
  font-weight:800;
  box-shadow:0 7px 18px rgba(200,16,46,.22);
  cursor:pointer;
  white-space:nowrap;
}

.live-btn:hover{
  background:var(--red-dark);
}

/* ================= BREAKING ================= */

.breaking{
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  min-height:46px;
  overflow:hidden;
}

.breaking-label{
  background:var(--red);
  color:#fff;
  min-width:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:800;
}

.breaking-label span{
  margin-right:6px;
}

.breaking-track{
  flex:1;
  overflow:hidden;
  display:flex;
  align-items:center;
  white-space:nowrap;
}

.breaking-text{
  padding-left:20px;
  font-size:14px;
  font-weight:600;
  animation:ticker 28s linear infinite;
}

@keyframes ticker{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* ================= CONTAINER ================= */

.container{
  max-width:var(--max);
  margin:auto;
  padding:28px 18px 60px;
}

/* ================= SEARCH ================= */

.search-panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:32px;
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  height:54px;
  border:1px solid #dfe2e6;
  border-radius:13px;
  padding:0 50px 0 18px;
  font-size:15px;
  outline:none;
  background:#fafbfc;
}

.search-box input:focus{
  border-color:var(--red);
  background:#fff;
  box-shadow:0 0 0 3px rgba(200,16,46,.08);
}

.search-icon{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px;
  color:#7a8088;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-top:13px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;
  border:1px solid #dfe2e6;
  background:#fff;
  border-radius:30px;
  padding:8px 18px;
  cursor:pointer;
  font-size:14px;
  font-weight:700;
  transition:.2s;
}

.category:hover,
.category.active{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

/* ================= SECTION TITLE ================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:0 0 16px;
}

.section-title{
  font-size:26px;
  font-weight:800;
  line-height:1.25;
  border-left:5px solid var(--red);
  padding-left:12px;
}

.section-sub{
  color:#858b92;
  font-size:13px;
}

/* ================= FEATURED ================= */

.featured{
  display:grid;
  grid-template-columns:1.8fr 1fr;
  gap:18px;
  margin-bottom:35px;
}

.hero{
  min-height:455px;
  border-radius:var(--radius);
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(135deg,#101620,#1a1d27 55%,#430d19);
  box-shadow:var(--shadow);
  color:#fff;
}

.hero:before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(200,16,46,.25);
  right:-130px;
  top:-130px;
  filter:blur(2px);
}

.hero-lines{
  position:absolute;
  inset:0;
  background:
    linear-gradient(125deg,transparent 45%,rgba(255,255,255,.04) 46%,transparent 47%);
}

.hero-content{
  position:absolute;
  left:34px;
  right:34px;
  bottom:32px;
  z-index:2;
}

.tag{
  display:inline-block;
  background:var(--red);
  color:#fff;
  padding:5px 11px;
  border-radius:6px;
  font-size:12px;
  font-weight:800;
  margin-bottom:12px;
}

.hero h1{
  font-size:32px;
  line-height:1.25;
  margin-bottom:9px;
  max-width:760px;
}

.hero p{
  color:#d3d7dc;
  font-size:14px;
  max-width:700px;
}

.meta{
  margin-top:13px;
  color:#aeb5bd;
  font-size:12px;
}

/* SIDE FEATURE */

.side-news{
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:18px;
}

.side-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:23px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.side-card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--red);
}

.side-card .small-tag{
  color:var(--red);
  font-size:11px;
  font-weight:800;
  margin-bottom:7px;
}

.side-card h3{
  font-size:20px;
  line-height:1.35;
  margin-bottom:7px;
}

.side-card p{
  color:#777e87;
  font-size:13px;
}

/* ================= NEWS GRID ================= */

.news-section{
  margin-top:15px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.news-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.25s;
}

.news-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-hover);
}

.news-image{
  height:205px;
  position:relative;
  overflow:hidden;
  background:#161c26;
}

.news-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.4s;
}

.news-card:hover .news-image img{
  transform:scale(1.04);
}

.news-body{
  padding:17px;
}

.news-category{
  color:var(--red);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:7px;
}

.news-card h3{
  font-size:18px;
  line-height:1.4;
  margin-bottom:7px;
}

.news-card p{
  color:#747b83;
  font-size:13px;
  line-height:1.55;
}

.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.card-date{
  color:#92979d;
  font-size:11px;
}

.share{
  border:0;
  background:#fff0f2;
  color:var(--red);
  border-radius:8px;
  padding:6px 9px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

/* ================= EMPTY ================= */

.no-result{
  display:none;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:40px 20px;
  text-align:center;
  color:#777;
}

/* ================= NEWSLETTER ================= */

.newsletter{
  margin-top:42px;
  background:linear-gradient(135deg,#151a23,#262c36);
  color:#fff;
  border-radius:var(--radius);
  padding:30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}

.newsletter h2{
  font-size:22px;
  margin-bottom:4px;
}

.newsletter p{
  color:#b9c0c8;
  font-size:13px;
}

.newsletter-btn{
  background:var(--red);
  color:#fff;
  border:0;
  padding:11px 20px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}

/* ================= FOOTER ================= */

.footer{
  background:#11151c;
  color:#fff;
  margin-top:20px;
}

.footer-inner{
  max-width:var(--max);
  margin:auto;
  padding:38px 18px 25px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr 1fr;
  gap:35px;
}

.footer-brand{
  font-family:Arial,sans-serif;
  font-size:22px;
  font-weight:800;
  margin-bottom:9px;
}

.footer-brand span{
  color:#e01b3d;
}

.footer p{
  color:#9ca3ad;
  font-size:13px;
}

.footer h4{
  font-size:14px;
  margin-bottom:12px;
}

.footer-links{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.footer-links a{
  color:#9ca3ad;
  font-size:13px;
}

.footer-links a:hover{
  color:#fff;
}

.copyright{
  border-top:1px solid #292e36;
  margin-top:30px;
  padding-top:18px;
  color:#7e8791;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

/* ================= FLOATING BUTTON ================= */

.back-top{
  position:fixed;
  right:20px;
  bottom:20px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(200,16,46,.28);
  display:none;
  z-index:900;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1050px){

  .header-inner{
    gap:12px;
  }

  .brand{
    min-width:220px;
  }

  .brand-title{
    font-size:21px;
  }

  .nav a{
    padding:8px 7px;
    font-size:13px;
  }

  .featured{
    grid-template-columns:1.4fr 1fr;
  }

}

@media(max-width:850px){

  .header{
    position:relative;
  }

  .header-inner{
    flex-wrap:wrap;
    padding:12px 15px;
  }

  .brand{
    flex:1;
    min-width:0;
  }

  .nav{
    order:3;
    width:100%;
    justify-content:flex-start;
    overflow-x:auto;
    border-top:1px solid #eee;
    padding-top:8px;
  }

  .nav::-webkit-scrollbar{
    display:none;
  }

  .nav a{
    flex-shrink:0;
  }

  .featured{
    grid-template-columns:1fr;
  }

  .hero{
    min-height:410px;
  }

  .side-news{
    grid-template-columns:1fr 1fr;
    grid-template-rows:none;
  }

  .news-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .footer-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .topbar-inner{
    padding:0 13px;
  }

  .top-right{
    display:none;
  }

  .header-inner{
    padding:11px 13px;
  }

  .logo{
    width:50px;
    height:50px;
  }

  .logo-main{
    font-size:23px;
  }

  .brand-title{
    font-size:18px;
  }

  .brand-sub{
    font-size:10px;
  }

  .live-btn{
    padding:9px 12px;
    font-size:12px;
  }

  .breaking-label{
    min-width:115px;
    font-size:12px;
  }

  .breaking-text{
    font-size:12px;
  }

  .container{
    padding:18px 12px 45px;
  }

  .search-panel{
    padding:12px;
    margin-bottom:25px;
  }

  .search-box input{
    height:48px;
    font-size:13px;
  }

  .category{
    padding:7px 15px;
    font-size:12px;
  }

  .section-title{
    font-size:21px;
    border-width:4px;
  }

  .section-sub{
    font-size:11px;
  }

  .hero{
    min-height:370px;
  }

  .hero-content{
    left:21px;
    right:21px;
    bottom:23px;
  }

  .hero h1{
    font-size:25px;
  }

  .hero p{
    font-size:12px;
  }

  .side-news{
    grid-template-columns:1fr;
    gap:12px;
  }

  .side-card{
    padding:19px;
  }

  .side-card h3{
    font-size:17px;
  }

  .news-grid{
    grid-template-columns:1fr;
    gap:14px;
  }

  .news-image{
    height:190px;
  }

  .news-card h3{
    font-size:17px;
  }

  .newsletter{
    flex-direction:column;
    align-items:flex-start;
    padding:23px;
  }

  .footer-grid{
    grid-template-columns:1fr 1fr;
    gap:25px 15px;
  }

  .footer-grid > div:first-child{
    grid-column:1/-1;
  }

  .copyright{
    flex-direction:column;
    gap:5px;
  }

}

@media(max-width:380px){

  .brand-title{
    font-size:16px;
  }

  .logo{
    width:46px;
    height:46px;
  }

  .live-btn{
    padding:8px 9px;
  }

  .hero h1{
    font-size:22px;
  }

}

/* ================= PRINT ================= */

@media print{
  .header,
  .breaking
