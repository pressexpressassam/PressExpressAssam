<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Press Express Assam — অসমৰ শেহতীয়া খবৰ</title>

<meta name="description"
content="Press Express Assam — অসমৰ স্থানীয়, ৰাজ্যিক, ৰাষ্ট্ৰীয় আৰু আন্তঃৰাষ্ট্ৰীয় শেহতীয়া খবৰ। সত্য, নিৰপেক্ষ আৰু দায়িত্বশীল সংবাদ।">

<meta name="theme-color" content="#c8102e">

<style>

/* =========================================================
   PRESS EXPRESS ASSAM
   PROFESSIONAL NEWS PORTAL DESIGN
   ========================================================= */

:root{
  --red:#c8102e;
  --dark:#101820;
  --dark2:#17212b;
  --text:#171b20;
  --muted:#737b83;
  --bg:#f4f6f8;
  --white:#ffffff;
  --border:#e5e8eb;
  --shadow:0 8px 28px rgba(16,24,32,.08);
  --radius:16px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    "Noto Sans Assamese",
    "Nirmala UI",
    "Arial Unicode MS",
    Arial,
    sans-serif;
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  max-width:100%;
  display:block;
}

button,
input{
  font:inherit;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
  background:var(--dark);
  color:#dce2e7;
  font-size:13px;
}

.topbar-inner{
  max-width:1400px;
  margin:auto;
  padding:8px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.topbar-right{
  font-weight:600;
}

/* =========================================================
   MAIN HEADER
   ========================================================= */

.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1400px;
  margin:auto;
  min-height:92px;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:28px;
}

.logo{
  width:92px;
  height:70px;
  object-fit:contain;
  flex-shrink:0;
}

.social{
  display:flex;
  gap:9px;
}

.social a{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
  font-size:15px;
  transition:.25s;
}

.social a:hover{
  transform:translateY(-3px);
}

.facebook{background:#1877f2}
.whatsapp{background:#20b968}
.instagram{background:linear-gradient(135deg,#7b2cff,#ff315c,#ff9f00)}
.youtube{background:#d60018}

.nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:25px;
}

.nav a{
  font-weight:700;
  font-size:16px;
  white-space:nowrap;
  position:relative;
}

.nav a:hover,
.nav a.active{
  color:var(--red);
}

.nav a.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-12px;
  height:3px;
  background:var(--red);
  border-radius:10px;
}

.live-btn{
  background:var(--red);
  color:white !important;
  padding:11px 18px;
  border-radius:9px;
  box-shadow:0 5px 14px rgba(200,16,46,.25);
}

/* =========================================================
   BREAKING BAR
   ========================================================= */

.breaking{
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  overflow:hidden;
}

.breaking-label{
  background:var(--red);
  color:#fff;
  font-weight:800;
  padding:12px 25px;
  min-width:155px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.breaking-track{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
}

.breaking-text{
  display:inline-block;
  padding:12px 0 12px 25px;
  animation:ticker 28s linear infinite;
  color:#454b51;
  font-weight:600;
}

@keyframes ticker{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* =========================================================
   PAGE CONTAINER
   ========================================================= */

.container{
  max-width:1400px;
  margin:auto;
  padding:28px 22px;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-area{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.03);
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  height:52px;
  border:1px solid #dfe3e7;
  border-radius:12px;
  padding:0 18px 0 48px;
  outline:none;
  font-size:15px;
  background:#fafbfc;
}

.search-box input:focus{
  border-color:var(--red);
  background:#fff;
}

.search-icon{
  position:absolute;
  left:17px;
  top:13px;
  font-size:22px;
  color:#888;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-top:13px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  border:1px solid #dfe3e7;
  background:white;
  padding:7px 18px;
  border-radius:30px;
  white-space:nowrap;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}

.category:hover,
.category.active{
  background:var(--red);
  color:white;
  border-color:var(--red);
}

/* =========================================================
   SECTION TITLE
   ========================================================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:35px 0 17px;
}

.section-title{
  font-size:27px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:11px;
}

.section-title:before{
  content:"";
  width:5px;
  height:30px;
  background:var(--red);
  border-radius:4px;
}

.section-link{
  color:var(--red);
  font-weight:700;
  font-size:14px;
}

/* =========================================================
   HERO GRID
   ========================================================= */

.hero-grid{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(330px,1fr);
  gap:20px;
}

.hero{
  position:relative;
  min-height:500px;
  border-radius:18px;
  overflow:hidden;
  background:#111;
  box-shadow:var(--shadow);
}

.hero img{
  width:100%;
  height:500px;
  object-fit:cover;
  opacity:.88;
  transition:.5s;
}

.hero:hover img{
  transform:scale(1.03);
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.90),
      rgba(0,0,0,.15) 65%,
      rgba(0,0,0,.05)
    );
}

.hero-content{
  position:absolute;
  left:28px;
  right:28px;
  bottom:28px;
  z-index:2;
  color:white;
}

.badge{
  display:inline-block;
  background:var(--red);
  color:white;
  font-size:12px;
  font-weight:800;
  padding:5px 11px;
  border-radius:5px;
  margin-bottom:12px;
}

.hero-title{
  font-size:38px;
  line-height:1.25;
  font-weight:900;
  margin-bottom:9px;
}

.hero-desc{
  color:#e8e8e8;
  font-size:15px;
}

/* =========================================================
   RIGHT SIDE FEATURED
   ========================================================= */

.side-news{
  display:flex;
  flex-direction:column;
  gap:16px;
}

.side-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  display:grid;
  grid-template-columns:150px 1fr;
  min-height:160px;
  box-shadow:var(--shadow);
  transition:.25s;
}

.side-card:hover{
  transform:translateY(-3px);
}

.side-card img{
  width:150px;
  height:160px;
  object-fit:cover;
}

.side-content{
  padding:16px;
}

.side-content .badge{
  margin-bottom:6px;
}

.side-title{
  font-size:19px;
  line-height:1.35;
  font-weight:850;
}

.side-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:8px;
}

/* =========================================================
   NEWS GRID
   ========================================================= */

.news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.news-card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
  transition:.25s;
}

.news-card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 30px rgba(0,0,0,.10);
}

.news-img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#e9edf0;
}

.news-content{
  padding:17px;
}

.news-meta{
  display:flex;
  align-items:center;
  gap:8px;
  color:#81878d;
  font-size:12px;
  margin-bottom:9px;
}

.news-category{
  background:#fff0f2;
  color:var(--red);
  padding:3px 8px;
  border-radius:5px;
  font-weight:800;
}

.news-title{
  font-size:20px;
  line-height:1.35;
  font-weight:850;
  margin-bottom:8px;
}

.news-excerpt{
  color:#737a80;
  font-size:14px;
}

.read-more{
  display:inline-block;
  margin-top:13px;
  color:var(--red);
  font-weight:800;
  font-size:14px;
}

/* =========================================================
   TWO COLUMN SECTION
   ========================================================= */

.content-layout{
  display:grid;
  grid-template-columns:minmax(0,2fr) 360px;
  gap:25px;
}

.list-news{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.list-card{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:18px;
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.04);
}

.list-card img{
  width:220px;
  height:150px;
  object-fit:cover;
}

.list-content{
  padding:15px 15px 15px 0;
}

.list-title{
  font-size:20px;
  font-weight:850;
  line-height:1.35;
}

.list-text{
  color:#777;
  font-size:14px;
  margin-top:7px;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar-box{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.sidebar-title{
  font-size:20px;
  font-weight:900;
  border-left:4px solid var(--red);
  padding-left:10px;
  margin-bottom:16px;
}

.ad-box{
  min-height:250px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fafafa;
  border:1px dashed #d8dde2;
  color:#999;
  font-size:13px;
}

.popular-item{
  display:flex;
  gap:11px;
  padding:11px 0;
  border-bottom:1px solid #edf0f2;
}

.popular-item:last-child{
  border-bottom:0;
}

.popular-number{
  color:var(--red);
  font-size:23px;
  font-weight:900;
}

.popular-title{
  font-weight:700;
  font-size:14px;
  line-height:1.4;
}

/* =========================================================
   BRAND STRIP
   ========================================================= */

.brand-strip{
  background:linear-gradient(135deg,#111820,#202a34);
  color:white;
  border-radius:18px;
  padding:28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:35px 0;
}

.brand-strip h2{
  font-size:25px;
}

.brand-strip p{
  color:#b9c1c8;
  margin-top:4px;
}

.brand-btn{
  background:var(--red);
  padding:12px 22px;
  border-radius:8px;
  font-weight:800;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer{
  background:#0d161d;
  color:#d9dfe4;
  margin-top:45px;
}

.footer-inner{
  max-width:1400px;
  margin:auto;
  padding:45px 22px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:45px;
}

.footer-logo{
  width:110px;
  height:80px;
  object-fit:contain;
  background:white;
  border-radius:9px;
  padding:5px;
  margin-bottom:15px;
}

.footer h3{
  color:white;
  font-size:17px;
  margin-bottom:13px;
}

.footer a{
  display:block;
  color:#aeb7be;
  margin:7px 0;
  font-size:14px;
}

.footer-about{
  color:#9da8b0;
  max-width:450px;
  font-size:14px;
}

.copyright{
  border-top:1px solid #27323b;
  padding:15px 22px;
  text-align:center;
  color:#89939b;
  font-size:12px;
}

/* =========================================================
   ADMIN BUTTON
   ========================================================= */

.admin-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:2000;
  background:var(--red);
  color:white;
  border:0;
  border-radius:30px;
  padding:13px 21px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

/* =========================================================
   LOADING
   ========================================================= */

.loading{
  padding:50px;
  text-align:center;
  color:#888;
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #ddd;
  border-top-color:var(--red);
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:1100px){

  .nav{
    gap:14px;
  }

  .nav a{
    font-size:14px;
  }

  .hero-grid{
    grid-template-columns:1fr;
  }

  .side-news{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .news-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .content-layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:768px){

  .topbar-inner{
    padding:7px 14px;
  }

  .header-inner{
    min-height:70px;
    padding:8px 14px;
    gap:12px;
  }

  .logo{
    width:70px;
    height:55px;
  }

  .social{
    display:none;
  }

  .nav{
    overflow-x:auto;
    margin-left:auto;
    gap:17px;
    scrollbar-width:none;
  }

  .nav::-webkit-scrollbar{
    display:none;
  }

  .nav a{
    font-size:13px;
  }

  .nav a.active:after{
    bottom:-7px;
  }

  .live-btn{
    padding:7px 12px;
  }

  .breaking-label{
    min-width:110px;
    padding:10px;
    font-size:12px;
  }

  .container{
    padding:18px 12px;
  }

  .section-title{
    font-size:23px;
  }

  .hero{
    min-height:360px;
  }

  .hero img{
    height:360px;
  }

  .hero-content{
    left:17px;
    right:17px;
    bottom:18px;
  }

  .hero-title{
    font-size:27px;
  }

  .side-news{
    display:flex;
  }

  .side-card{
    grid-template-columns:120px 1fr;
  }

  .side-card img{
    width:120px;
    height:135px;
  }

  .side-title{
    font-size:16px;
  }

  .news-grid{
    grid-template-columns:1fr;
  }

  .news-img{
    height:210px;
  }

  .list-card{
    grid-template-columns:120px 1fr;
  }

  .list-card img{
    width:120px;
    height:125px;
  }

  .list-content{
    padding:10px 10px 10px 0;
  }

  .list-title{
    font-size:16px;
  }

  .list-text{
    display:none;
  }

  .brand-strip{
    display:block;
    padding:22px;
  }

  .brand-btn{
    display:inline-block;
    margin-top:14px;
  }

  .footer-inner{
    grid-template-columns:1fr;
    gap:25px;
    padding:30px 18px;
  }

  .admin-btn{
    right:14px;
    bottom:14px;
    padding:11px 17px;
  }
}

/* =========================================================
   EXTRA SMALL
   ========================================================= */

@media(max-width:420px){

  .nav a
